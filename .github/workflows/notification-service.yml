name: Notification Service

on:
  push:
    branches: [develop, main]
    paths: ['services/notification-service/**']
  pull_request:
    branches: [develop]
    paths: ['services/notification-service/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test services/notification-service/NotificationService.Tests/NotificationService.Tests.csproj

  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "TAG=qa" >> $GITHUB_OUTPUT
            echo "APP_NAME=teamtasks-notification-service-qa" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=staging" >> $GITHUB_OUTPUT
            echo "APP_NAME=teamtasks-notification-service-staging" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ steps.env.outputs.TAG }} \
            services/notification-service/
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ steps.env.outputs.TAG }}

      - name: Trigger Azure CD Webhook (QA)
        if: github.ref == 'refs/heads/develop'
        run: |
          PUBLISH_PROFILE='${{ secrets.AZURE_PUBLISH_PROFILE_QA_NOTIF }}'
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)
          curl -f -X POST -u "${USERNAME}:${PASSWORD}" "https://${{ steps.env.outputs.APP_NAME }}.scm.azurewebsites.net/docker/hook"

      - name: Trigger Azure CD Webhook (Staging)
        if: github.ref == 'refs/heads/main'
        run: |
          PUBLISH_PROFILE='${{ secrets.AZURE_PUBLISH_PROFILE_STAGING_NOTIF }}'
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)
          curl -f -X POST -u "${USERNAME}:${PASSWORD}" "https://${{ steps.env.outputs.APP_NAME }}.scm.azurewebsites.net/docker/hook"
