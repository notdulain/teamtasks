name: Task Service

on:
  push:
    branches: [develop, main]
    paths: ['services/task-service/**']
  pull_request:
    branches: [develop]
    paths: ['services/task-service/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test services/task-service/TaskService.Tests/TaskService.Tests.csproj

  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "TAG=qa" >> $GITHUB_OUTPUT
            echo "APP_NAME=teamtasks-task-service-qa" >> $GITHUB_OUTPUT
            echo "RESOURCE_GROUP=teamtasks-qa" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=staging" >> $GITHUB_OUTPUT
            echo "APP_NAME=teamtasks-task-service-staging" >> $GITHUB_OUTPUT
            echo "RESOURCE_GROUP=teamtasks-staging" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/task-service:${{ steps.env.outputs.TAG }} \
            services/task-service/
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task-service:${{ steps.env.outputs.TAG }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Azure
        run: |
          az webapp config container set \
            --name ${{ steps.env.outputs.APP_NAME }} \
            --resource-group ${{ steps.env.outputs.RESOURCE_GROUP }} \
            --container-image-name ${{ secrets.DOCKERHUB_USERNAME }}/task-service:${{ steps.env.outputs.TAG }}
          az webapp restart \
            --name ${{ steps.env.outputs.APP_NAME }} \
            --resource-group ${{ steps.env.outputs.RESOURCE_GROUP }}
